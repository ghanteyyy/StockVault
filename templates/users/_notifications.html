<section class="sv-notifications notification-panel" id="notification-panel" aria-labelledby="notification-title" data-feed-url="{% url 'notification-feed' %}" data-read-url="{% url 'notification-read' %}" hidden>
    {% csrf_token %}
    <header class="notification-panel-header">
        <button class="notification-close" type="button" aria-label="Back to navigation">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 12H5m7 7-7-7 7-7" />
            </svg>
        </button>
        <h2 id="notification-title">Notifications</h2>
    </header>
    <p class="notification-status" role="status" hidden></p>
    <ul class="notification-list" role="list" aria-label="Notifications" tabindex="0" hidden></ul>
    <p class="notification-more-status" role="status" hidden></p>
    <button class="notification-more" type="button" hidden>Load older notifications</button>
</section>
