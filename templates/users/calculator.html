{% extends 'users/root.html' %}
{% load static %}

{% block css %}
    <link rel="stylesheet" href="{% static 'css/users/calculator.css' %}">
{% endblock %}

{% block content %}
    <div class="content">
        <div class="left-wrapper">
            <h1>Calculator</h1>

            <p class="error-message" role="alert" style="display: none;">All fields are required and valid</p>

            <div class="transaction-type">
                <p class="legend-title">Transaction Type:</p>
                <select id="transaction-type">
                    <option value="" selected disabled>Select Type</option>
                    <option value="buy">BUY</option>
                    <option value="sell">SELL</option>
                </select>
            </div>

            <div class="buy-type">
                <p class="legend-title">Buy Type:</p>
                <div class="radio-buttons">
                    <div class="radio-button">
                        <input type="radio" id="ipo" name="buy-type" value="ipo">
                        <label for="ipo">IPO</label>
                    </div>
                    <div class="radio-button">
                        <input type="radio" id="secondary" name="buy-type" value="secondary">
                        <label for="secondary">Secondary</label>
                    </div>
                </div>
            </div>

            <div class="input-icon-wrapper">
                <i class="fas fa-layer-group"></i>
                <input type="text" placeholder="Number of Shares" id="share-quantity">
            </div>

            <div class="input-icon-wrapper">
                <i class="fas fa-arrow-up"></i>
                <input type="text" placeholder="Purchase Price per share" id="purchase-price">
            </div>

            <div class="input-icon-wrapper" id="selling_price_wrapper">
                <i class="fas fa-arrow-down"></i>
                <input type="text" placeholder="Selling Price per share" id="selling-price">
            </div>

            <div class="CGT">
                <p class="legend-title">Capital Gain Tax</p>
                <select id="CGT">
                    <option value="" selected disabled>Select Capital Gain Tax</option>
                    <option value="365 days or less (5%)">Up to 365 days (5%)</option>
                    <option value="365 days or more (3.75%)">Over 365 days (3.75%)</option>
                    <option value="Institutional (10%)">Institutional (10%)</option>
                </select>
            </div>

            <button type="button" class="submit" id="submit">Calculate</button>
        </div>

        <div class="right-wrapper">
            <div id="output" class="output-wrapper" aria-label="Result" aria-live="polite">
                Calculation will appear here
            </div>
        </div>
    </div>

{% endblock %}

{% block js %}
    <script src="{% static 'js/users/calculator.js' %}" defer></script>
{% endblock %}
