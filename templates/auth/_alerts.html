{% if errors %}
    <div class="auth-alert" role="alert" tabindex="-1">
        <strong>Please check your details.</strong>
        <ul>
            {% for error in errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
{% endif %}
{% for message in messages %}
    <div class="auth-alert" role="alert" tabindex="-1">{{ message }}</div>
{% endfor %}
